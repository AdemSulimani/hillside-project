name: Deploy

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - staging
          - production

jobs:
  deploy-staging:
    name: Deploy Staging
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Trigger Render staging deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.STAGING_RENDER_DEPLOY_HOOK_URL }}
        run: |
          test -n "$RENDER_DEPLOY_HOOK_URL"
          curl --fail --silent --show-error -X POST "$RENDER_DEPLOY_HOOK_URL"

      - name: Trigger Vercel staging deploy
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.STAGING_VERCEL_DEPLOY_HOOK_URL }}
        run: |
          test -n "$VERCEL_DEPLOY_HOOK_URL"
          curl --fail --silent --show-error -X POST "$VERCEL_DEPLOY_HOOK_URL"

      - name: Verify staging health endpoint
        env:
          HEALTHCHECK_URL: ${{ secrets.STAGING_HEALTHCHECK_URL }}
        run: |
          test -n "$HEALTHCHECK_URL"
          for i in $(seq 1 12); do
            if curl --fail --silent --show-error "$HEALTHCHECK_URL" > /dev/null; then
              echo "Staging health check passed"
              exit 0
            fi
            echo "Waiting for staging health endpoint ($i/12)..."
            sleep 10
          done
          echo "Staging health check failed"
          exit 1

  deploy-production:
    name: Deploy Production
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'production') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.PROD_SSH_PASSPHRASE }}
          script_stop: true
          script: |
            export APP_DIR="${{ secrets.PROD_APP_DIR }}"
            export REPOSITORY="${{ github.repository }}"
            export REF_NAME="${{ github.ref_name }}"
            export TARGET_SHA="${{ github.sha }}"
            export BACKEND_ENV_B64="${{ secrets.PROD_BACKEND_ENV_B64 }}"
            export FRONTEND_ENV_B64="${{ secrets.PROD_FRONTEND_ENV_B64 }}"
            export REPO_ACCESS_TOKEN="${{ secrets.PROD_REPO_ACCESS_TOKEN }}"
            if [ -z "$REPO_ACCESS_TOKEN" ]; then
              echo "Missing PROD_REPO_ACCESS_TOKEN secret"
              exit 1
            fi
            REPO_URL="https://x-access-token:${REPO_ACCESS_TOKEN}@github.com/$REPOSITORY.git"
            if [ ! -d "$APP_DIR/.git" ]; then
              git clone "$REPO_URL" "$APP_DIR"
            fi
            cd "$APP_DIR"
            git remote set-url origin "$REPO_URL"
            git fetch --all --tags
            git checkout --force main || git checkout -B main origin/main
            git reset --hard "$TARGET_SHA"
            bash "$APP_DIR/scripts/deploy.sh" production

      - name: Verify production health endpoint
        env:
          HEALTHCHECK_URL: ${{ secrets.PROD_HEALTHCHECK_URL }}
        run: |
          test -n "$HEALTHCHECK_URL"
          for i in $(seq 1 12); do
            if curl --fail --silent --show-error "$HEALTHCHECK_URL" > /dev/null; then
              echo "Production health check passed"
              exit 0
            fi
            echo "Waiting for production health endpoint ($i/12)..."
            sleep 10
          done
          echo "Production health check failed"
          exit 1
