name: Deploy

on:
  # Staging no longer deploys straight off a push to main: it waits for the
  # CI workflow to complete and only fires on success (audit RC-23 / P0-1).
  # NOTE: "CI" must match the `name:` in ci.yml exactly — renaming that
  # workflow silently stops staging deploys (fail-closed).
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  push:
    tags:
      - "v*"
  # Escape hatch: manual deploys bypass the CI gate.
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - staging
          - production

jobs:
  deploy-staging:
    name: Deploy Staging
    # workflow_run guard: only green CI runs, only for pushes (not PRs, which
    # excludes forks), only on main (tag-push CI runs carry the tag name in
    # head_branch), and only from this repository.
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - name: Trigger Render staging deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.STAGING_RENDER_DEPLOY_HOOK_URL }}
        run: |
          test -n "$RENDER_DEPLOY_HOOK_URL"
          curl --fail --silent --show-error -X POST "$RENDER_DEPLOY_HOOK_URL"

      - name: Trigger Vercel staging deploy
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.STAGING_VERCEL_DEPLOY_HOOK_URL }}
        run: |
          test -n "$VERCEL_DEPLOY_HOOK_URL"
          curl --fail --silent --show-error -X POST "$VERCEL_DEPLOY_HOOK_URL"

      - name: Verify staging health endpoint
        env:
          HEALTHCHECK_URL: ${{ secrets.STAGING_HEALTHCHECK_URL }}
        run: |
          test -n "$HEALTHCHECK_URL"
          for i in $(seq 1 12); do
            if curl --fail --silent --show-error "$HEALTHCHECK_URL" > /dev/null; then
              echo "Staging health check passed"
              exit 0
            fi
            echo "Waiting for staging health endpoint ($i/12)..."
            sleep 10
          done
          echo "Staging health check failed"
          exit 1

  deploy-production:
    name: Deploy Production
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'production') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    environment: production
    permissions:
      actions: read
      contents: read
    steps:
      # Tag deploys must not race or bypass CI: wait for a successful CI run
      # for this exact commit (ci.yml also runs on v* tags, so one always
      # exists or is in flight). Manual workflow_dispatch skips this gate.
      - name: Require green CI for this commit
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "Waiting for a successful CI run for ${GITHUB_SHA}"
          deadline=$((SECONDS + 1200))
          while true; do
            runs=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&per_page=100" --jq '.workflow_runs')
            success=$(echo "$runs" | jq '[.[] | select(.conclusion == "success")] | length')
            pending=$(echo "$runs" | jq '[.[] | select(.status != "completed")] | length')
            total=$(echo "$runs" | jq 'length')
            if [ "$success" -gt 0 ]; then
              echo "CI succeeded for ${GITHUB_SHA}"
              exit 0
            fi
            if [ "$total" -gt 0 ] && [ "$pending" -eq 0 ]; then
              echo "ERROR: all $total CI run(s) for ${GITHUB_SHA} completed without success"
              exit 1
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "ERROR: timed out waiting for CI on ${GITHUB_SHA}"
              exit 1
            fi
            echo "CI not green yet ($total run(s), $pending in progress); retrying in 20s..."
            sleep 20
          done

      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.PROD_SSH_PASSPHRASE }}
          script_stop: true
          # Build on a 1 vCPU droplet (npm ci + tsc + sharp/tesseract) plus the in-script
          # health wait can take longer than the SSH action's default 10 minutes.
          command_timeout: 30m
          script: |
            export APP_DIR="${{ secrets.PROD_APP_DIR }}"
            export REPOSITORY="${{ github.repository }}"
            export REF_NAME="${{ github.ref_name }}"
            export TARGET_SHA="${{ github.sha }}"
            export BACKEND_ENV_B64="${{ secrets.PROD_BACKEND_ENV_B64 }}"
            export FRONTEND_ENV_B64="${{ secrets.PROD_FRONTEND_ENV_B64 }}"
            export REPO_ACCESS_TOKEN="${{ secrets.PROD_REPO_ACCESS_TOKEN }}"
            if [ -z "$REPO_ACCESS_TOKEN" ]; then
              echo "Missing PROD_REPO_ACCESS_TOKEN secret"
              exit 1
            fi
            REPO_URL="https://x-access-token:${REPO_ACCESS_TOKEN}@github.com/$REPOSITORY.git"
            if [ ! -d "$APP_DIR/.git" ]; then
              git clone "$REPO_URL" "$APP_DIR"
            fi
            cd "$APP_DIR"
            git remote set-url origin "$REPO_URL"
            git fetch --all --tags
            git checkout --force main || git checkout -B main origin/main
            git reset --hard "$TARGET_SHA"
            bash "$APP_DIR/scripts/deploy.sh" production

      - name: Verify production health endpoint
        env:
          HEALTHCHECK_URL: ${{ secrets.PROD_HEALTHCHECK_URL }}
        run: |
          test -n "$HEALTHCHECK_URL"
          for i in $(seq 1 12); do
            if curl --fail --silent --show-error "$HEALTHCHECK_URL" > /dev/null; then
              echo "Production health check passed"
              exit 0
            fi
            echo "Waiting for production health endpoint ($i/12)..."
            sleep 10
          done
          echo "Production health check failed"
          exit 1
