name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Typecheck + Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  backend-smoke:
    name: Backend Migration + Health Smoke
    runs-on: ubuntu-latest
    needs: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hillside_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d hillside_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    defaults:
      run:
        working-directory: backend
    env:
      PORT: 8000
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hillside_ci
      REDIS_URL: redis://localhost:6379
      FRONTEND_URL: http://localhost:3000
      BACKEND_URL: http://localhost:8000
      JWT_SECRET: ${{ secrets.CI_JWT_SECRET || 'ci-jwt-secret' }}
      JWT_REFRESH_SECRET: ${{ secrets.CI_JWT_REFRESH_SECRET || 'ci-refresh-secret' }}
      OPENAI_API_KEY: ${{ secrets.CI_OPENAI_API_KEY || 'ci-placeholder-key' }}
      ENCRYPTION_KEY: ${{ secrets.CI_ENCRYPTION_KEY }}
      ADMIN_JWT_SECRET: ${{ secrets.CI_ADMIN_JWT_SECRET || 'ci-admin-secret' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run migrations
        run: npm run migrate

      - name: Start API
        run: node dist/server.js > /tmp/backend.log 2>&1 &

      - name: Wait for API
        run: |
          for i in $(seq 1 12); do
            if curl --fail --silent --show-error http://127.0.0.1:8000/api/health > /dev/null; then
              echo "API is healthy"
              exit 0
            fi
            echo "Waiting for API ($i/12)..."
            sleep 5
          done
          echo "API failed to become healthy in time"
          exit 1

      - name: Verify health endpoint
        run: curl --fail --silent --show-error http://127.0.0.1:8000/api/health

      - name: Print backend logs on failure
        if: failure()
        run: cat /tmp/backend.log

  frontend:
    name: Frontend Lint + Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
