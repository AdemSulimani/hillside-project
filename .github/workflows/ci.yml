name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    # Tag pushes run CI too so the production deploy gate always has a CI run
    # for the tagged commit to wait on (see deploy.yml "Require green CI").
    tags: ["v*"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Typecheck + Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # P2-7: fail the PR if backend/.env.example has drifted from the config manifest
      # (config/knobs.ts) — a knob read by the code but undocumented, or documented with a value
      # that disagrees with the code default (the QUALITY_THRESHOLD 0.6-vs-0.1 class of trap).
      # Offline: no DB, no secrets, no network. The DB-backed half runs in backend-smoke below.
      - name: Config manifest vs .env.example
        run: npm run config:check -- --source=env-example

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # P3-4 (RC-01): the golden corpora are a RELEASE GATE, so they must be provably non-flaky —
      # the remediation plan's own stated hazard is "a flaky assertion blocks deploys".
      # `npm test` above already runs ALL THREE corpora (the glob covers src/eval/**/__tests__).
      # This step adds the stability assertion the plan asks for, and it covers the RC-01 corpus
      # specifically: that is the only one whose assertions consume random draws, so it is the only
      # one whose reproducibility is a live question. Three SEPARATE processes, not an in-process
      # loop, because process-seed-dependent nondeterminism is the only kind that could still flake.
      # Offline: no DB, no Redis, no network, no OpenAI key.
      - name: Golden determinism (RC-01 corpus, 3× identical digest)
        run: |
          # Truncate first: on a self-hosted runner the workspace persists, and stale digests from
          # a previous run would otherwise accumulate and fail this spuriously.
          rm -f /tmp/golden-digests.txt
          for i in 1 2 3; do
            npm run --silent eval:golden -- --digest >> /tmp/golden-digests.txt || exit 1
          done
          cat /tmp/golden-digests.txt
          if [ "$(sort -u /tmp/golden-digests.txt | wc -l)" -ne 1 ]; then
            echo "::error::golden set is NOT reproducible — three runs produced different digests"
            exit 1
          fi
          echo "golden set reproducible across 3 runs"

  backend-smoke:
    name: Backend Migration + Health Smoke
    runs-on: ubuntu-latest
    needs: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hillside_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d hillside_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    defaults:
      run:
        working-directory: backend
    env:
      PORT: 8000
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hillside_ci
      REDIS_URL: redis://localhost:6379
      FRONTEND_URL: http://localhost:3000
      BACKEND_URL: http://localhost:8000
      BACKBLAZE_REGION: ${{ secrets.CI_BACKBLAZE_REGION || 'eu-central-003' }}
      JWT_SECRET: ${{ secrets.CI_JWT_SECRET || 'ci-jwt-secret' }}
      JWT_REFRESH_SECRET: ${{ secrets.CI_JWT_REFRESH_SECRET || 'ci-refresh-secret' }}
      OPENAI_API_KEY: ${{ secrets.CI_OPENAI_API_KEY || 'ci-placeholder-key' }}
      # Required since P1-4: validateEnv fail-fasts at boot unless the embedding model is set
      # to a 1536-dim model matching the products.embedding vector(1536) column. Without this
      # the API exits(1) on startup and the health smoke never connects.
      OPENAI_EMBEDDING_MODEL: text-embedding-3-small
      ENCRYPTION_KEY: ${{ secrets.CI_ENCRYPTION_KEY }}
      ADMIN_JWT_SECRET: ${{ secrets.CI_ADMIN_JWT_SECRET || 'ci-admin-secret' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run migrations
        run: npm run migrate
        env:
          # Fail fast on duplicate/out-of-order migration ordinals, unannotated
          # transaction-hostile SQL, or checksum drift in CI; plain container
          # boots only warn (see db/migrate.ts).
          MIGRATE_STRICT: "1"

      # P3-3: assert the just-migrated ledger — monotonic applied order across the
      # on-disk set, no duplicate-ordinal application, no checksum drift, and every
      # on-disk row carries provenance (checksum + applied_seq).
      - name: Verify migration ledger
        run: npm run migrate:verify -- --strict

      # P2-7: the STRICT config gate. This is the program that fails on config drift — a runtime
      # boot deliberately only warns (a mis-set deploy must not become an outage), so this step is
      # where "a PR reintroducing a drift goes red" actually happens.
      # Runs after migrations because it probes the REAL embedding-column dimension via
      # pg_attribute (information_schema does not expose it for pgvector types).
      - name: Strict config check
        run: npm run config:check -- --strict
        env:
          STRICT_CONFIG_VALIDATION: strict

      - name: Start API
        run: node dist/server.js > /tmp/backend.log 2>&1 &

      - name: Wait for API
        run: |
          for i in $(seq 1 12); do
            if curl --fail --silent --show-error http://127.0.0.1:8000/api/health > /dev/null; then
              echo "API is healthy"
              exit 0
            fi
            echo "Waiting for API ($i/12)..."
            sleep 5
          done
          echo "API failed to become healthy in time"
          exit 1

      - name: Verify health endpoint
        run: curl --fail --silent --show-error http://127.0.0.1:8000/api/health

      - name: Print backend logs on failure
        if: failure()
        run: cat /tmp/backend.log

  migration-shape:
    # P3-3 (RC-23): prove the runner on the two shapes dev cannot easily produce —
    # a full up/down/up round-trip converges to an identical schema, and a ledger
    # carrying orphan rows (files deleted, rows remain — the offers branch, EV-037)
    # migrates + verifies cleanly. Own fresh pgvector DB; no OpenAI env (migrate
    # and verify never call the API).
    name: Migration Round-trip + Orphan Shape
    runs-on: ubuntu-latest
    needs: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hillside_shape
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d hillside_shape"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hillside_shape
      MIGRATE_STRICT: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Snapshot schema (before round-trip)
        run: node dist/db/schemaSnapshot.js > /tmp/schema-before.txt

      - name: Apply full tree
        run: npm run migrate

      - name: Verify ledger
        run: npm run migrate:verify -- --strict

      - name: Snapshot schema (after full apply)
        run: node dist/db/schemaSnapshot.js > /tmp/schema-full.txt

      - name: Down — revert the reversible tip (083 provenance + 082 blobs)
        run: npm run migrate:down -- --steps=2
        env:
          MIGRATE_ALLOW_DOWN: "1"

      - name: Re-apply + verify (round-trip converges)
        run: |
          npm run migrate
          npm run migrate:verify -- --strict

      - name: Assert schema identical after up/down/up
        run: |
          node dist/db/schemaSnapshot.js > /tmp/schema-roundtrip.txt
          diff /tmp/schema-full.txt /tmp/schema-roundtrip.txt \
            && echo "schema identical after up/down/up"

      - name: Seed orphan _migrations rows (deleted-file rows remain)
        run: |
          psql "$DATABASE_URL" -c "INSERT INTO _migrations (name) VALUES \
            ('063_create_offers.sql'), \
            ('064_add_offer_columns_to_orders.sql'), \
            ('065_offers_promotions_prompt_block.sql')"

      - name: Migrate + verify tolerates orphan rows
        run: |
          npm run migrate
          npm run migrate:verify -- --strict

  frontend:
    name: Frontend Lint + Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
