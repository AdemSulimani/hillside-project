name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    # Tag pushes run CI too so the production deploy gate always has a CI run
    # for the tagged commit to wait on (see deploy.yml "Require green CI").
    tags: ["v*"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Typecheck + Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # P2-7: fail the PR if backend/.env.example has drifted from the config manifest
      # (config/knobs.ts) — a knob read by the code but undocumented, or documented with a value
      # that disagrees with the code default (the QUALITY_THRESHOLD 0.6-vs-0.1 class of trap).
      # Offline: no DB, no secrets, no network. The DB-backed half runs in backend-smoke below.
      - name: Config manifest vs .env.example
        run: npm run config:check -- --source=env-example

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # P3-4 (RC-01): the golden corpora are a RELEASE GATE, so they must be provably non-flaky —
      # the remediation plan's own stated hazard is "a flaky assertion blocks deploys".
      # `npm test` above already runs ALL THREE corpora (the glob covers src/eval/**/__tests__).
      # This step adds the stability assertion the plan asks for, and it covers the RC-01 corpus
      # specifically: that is the only one whose assertions consume random draws, so it is the only
      # one whose reproducibility is a live question. Three SEPARATE processes, not an in-process
      # loop, because process-seed-dependent nondeterminism is the only kind that could still flake.
      # Offline: no DB, no Redis, no network, no OpenAI key.
      - name: Golden determinism (RC-01 corpus, 3× identical digest)
        run: |
          # Truncate first: on a self-hosted runner the workspace persists, and stale digests from
          # a previous run would otherwise accumulate and fail this spuriously.
          rm -f /tmp/golden-digests.txt
          for i in 1 2 3; do
            npm run --silent eval:golden -- --digest >> /tmp/golden-digests.txt || exit 1
          done
          cat /tmp/golden-digests.txt
          if [ "$(sort -u /tmp/golden-digests.txt | wc -l)" -ne 1 ]; then
            echo "::error::golden set is NOT reproducible — three runs produced different digests"
            exit 1
          fi
          echo "golden set reproducible across 3 runs"

  backend-smoke:
    name: Backend Migration + Health Smoke
    runs-on: ubuntu-latest
    needs: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hillside_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d hillside_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    defaults:
      run:
        working-directory: backend
    env:
      PORT: 8000
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hillside_ci
      REDIS_URL: redis://localhost:6379
      FRONTEND_URL: http://localhost:3000
      BACKEND_URL: http://localhost:8000
      BACKBLAZE_REGION: ${{ secrets.CI_BACKBLAZE_REGION || 'eu-central-003' }}
      JWT_SECRET: ${{ secrets.CI_JWT_SECRET || 'ci-jwt-secret' }}
      JWT_REFRESH_SECRET: ${{ secrets.CI_JWT_REFRESH_SECRET || 'ci-refresh-secret' }}
      OPENAI_API_KEY: ${{ secrets.CI_OPENAI_API_KEY || 'ci-placeholder-key' }}
      # Required since P1-4: validateEnv fail-fasts at boot unless the embedding model is set
      # to a 1536-dim model matching the products.embedding vector(1536) column. Without this
      # the API exits(1) on startup and the health smoke never connects.
      OPENAI_EMBEDDING_MODEL: text-embedding-3-small
      ENCRYPTION_KEY: ${{ secrets.CI_ENCRYPTION_KEY }}
      ADMIN_JWT_SECRET: ${{ secrets.CI_ADMIN_JWT_SECRET || 'ci-admin-secret' }}
      # P3-2. `all` is the default anyway, but pinning it here documents that this smoke exercises
      # the single-process topology; the split is covered by the `split-topology` job below.
      PROCESS_ROLE: all
      # P3-2 adds exactly one new boot fatal: PROCESS_ROLE=worker with this off refuses to start.
      # It cannot fire in this job (role is `all`), but per CLAUDE.md §11 any variable that gates a
      # fatal belongs in this env block so the smoke never breaks on a config the code now requires.
      SOCKET_CROSS_PROCESS_EMIT: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run migrations
        run: npm run migrate
        env:
          # Fail fast on duplicate/out-of-order migration ordinals, unannotated
          # transaction-hostile SQL, or checksum drift in CI; plain container
          # boots only warn (see db/migrate.ts).
          MIGRATE_STRICT: "1"

      # P3-3: assert the just-migrated ledger — monotonic applied order across the
      # on-disk set, no duplicate-ordinal application, no checksum drift, and every
      # on-disk row carries provenance (checksum + applied_seq).
      - name: Verify migration ledger
        run: npm run migrate:verify -- --strict

      # P2-7: the STRICT config gate. This is the program that fails on config drift — a runtime
      # boot deliberately only warns (a mis-set deploy must not become an outage), so this step is
      # where "a PR reintroducing a drift goes red" actually happens.
      # Runs after migrations because it probes the REAL embedding-column dimension via
      # pg_attribute (information_schema does not expose it for pgvector types).
      - name: Strict config check
        run: npm run config:check -- --strict
        env:
          STRICT_CONFIG_VALIDATION: strict

      - name: Start API
        run: node dist/server.js > /tmp/backend.log 2>&1 &

      - name: Wait for API
        run: |
          for i in $(seq 1 12); do
            if curl --fail --silent --show-error http://127.0.0.1:8000/api/health > /dev/null; then
              echo "API is healthy"
              exit 0
            fi
            echo "Waiting for API ($i/12)..."
            sleep 5
          done
          echo "API failed to become healthy in time"
          exit 1

      - name: Verify health endpoint
        run: curl --fail --silent --show-error http://127.0.0.1:8000/api/health

      - name: Print backend logs on failure
        if: failure()
        run: cat /tmp/backend.log

  migration-shape:
    # P3-3 (RC-23): prove the runner on the shapes dev cannot easily produce — the REAL tree
    # applies clean from scratch and verifies strict, and a ledger carrying orphan rows (files
    # deleted, rows remain — the offers branch, EV-037) migrates + verifies cleanly. Own fresh
    # pgvector DB; no OpenAI env (migrate and verify never call the API).
    #
    # P3-5: the up/down/up round-trip that used to live here moved to a synthetic tree in the
    # integration suite — see the note further down for why the real tree was never entitled to
    # make a reversibility claim.
    name: Migration Apply + Orphan Shape
    runs-on: ubuntu-latest
    needs: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hillside_shape
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d hillside_shape"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hillside_shape
      MIGRATE_STRICT: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Apply full tree
        run: npm run migrate

      - name: Verify ledger
        run: npm run migrate:verify -- --strict

      # P3-5: the up/down/up round-trip moved to a SYNTHETIC tree, in
      # src/__integration__/migrateRunner.integration.test.ts.
      #
      # This step used to run `migrate:down --steps=2` against the REAL tree, which silently
      # assumed the two newest migrations are always structural and reversible. `runDown` reverts
      # from the top of the stack and refuses the whole range if any file in it lacks a paired
      # down file — so the first DATA migration to land at the tip breaks it, and by house rule
      # (data/prompt migrations get no down file; their inverse is the P3-5 registry) that was
      # always going to happen. 085 is the one that did; any of the 19 prompt-content migrations
      # would have.
      #
      # Up/down/up convergence is a property of the RUNNER, so it is asserted on a tree the test
      # controls. What the real tree still proves here — that it applies clean from scratch,
      # verifies strict, and tolerates orphan ledger rows — is below and unchanged.

      - name: Seed orphan _migrations rows (deleted-file rows remain)
        run: |
          psql "$DATABASE_URL" -c "INSERT INTO _migrations (name) VALUES \
            ('063_create_offers.sql'), \
            ('064_add_offer_columns_to_orders.sql'), \
            ('065_offers_promotions_prompt_block.sql')"

      - name: Migrate + verify tolerates orphan rows
        run: |
          npm run migrate
          npm run migrate:verify -- --strict

  backend-integration:
    # P3 audit fix (M4): the integration suite guarded nothing — `npm run test:integration` was
    # defined but no workflow ran it, so the P3-3 up/down/up reversibility round-trip + chaos
    # recovery, the P3-6 cost-rollup/DB agreement, and the P3-2 tenant-slot-lease races only ever
    # ran on a developer's machine. Own DB: migrateRunner creates and drops scratch databases
    # (hillside_mig_*), which must not race backend-smoke's health checks.
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    needs: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hillside_int
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d hillside_int"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hillside_int
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ${{ secrets.CI_JWT_SECRET || 'ci-jwt-secret' }}
      JWT_REFRESH_SECRET: ${{ secrets.CI_JWT_REFRESH_SECRET || 'ci-refresh-secret' }}
      OPENAI_API_KEY: ${{ secrets.CI_OPENAI_API_KEY || 'ci-placeholder-key' }}
      OPENAI_EMBEDDING_MODEL: text-embedding-3-small
      ENCRYPTION_KEY: ${{ secrets.CI_ENCRYPTION_KEY }}
      ADMIN_JWT_SECRET: ${{ secrets.CI_ADMIN_JWT_SECRET || 'ci-admin-secret' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The suites assume a migrated schema (they seed tenants/channels/ledger rows); the
      # migrate-runner suite additionally creates its own scratch DBs and needs nothing here.
      - name: Apply migrations
        run: npm run migrate
        env:
          MIGRATE_STRICT: "1"

      - name: Integration tests
        run: npm run test:integration

  split-topology:
    # P3-2: prove the two-process topology on the two claims the audit item states as acceptance —
    # "a worker-only deploy leaves the API up" and "an API-only deploy leaves the queue draining".
    # No Docker needed: two Node processes against the CI Postgres + Redis is the same failure
    # domain question, and it is the only place the split is exercised before staging.
    name: Split Topology Smoke
    runs-on: ubuntu-latest
    needs: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hillside_split
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    defaults:
      run:
        working-directory: backend
    env:
      PORT: 8000
      WORKER_HEALTH_PORT: 8001
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hillside_split
      REDIS_URL: redis://localhost:6379
      FRONTEND_URL: http://localhost:3000
      BACKEND_URL: http://localhost:8000
      JWT_SECRET: ci-jwt-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
      OPENAI_API_KEY: ci-placeholder-key
      OPENAI_EMBEDDING_MODEL: text-embedding-3-small
      ADMIN_JWT_SECRET: ci-admin-secret
      ENCRYPTION_KEY: ${{ secrets.CI_ENCRYPTION_KEY }}
      # REQUIRED, and not obviously so: services/backblazeService.ts constructs an S3Client at
      # MODULE LOAD, and the AWS SDK throws "Region is missing" on an empty region. So `import app`
      # dies before listen without it — the process logs its config banner and then exits, which
      # reads like a mysteriously dead server. This is the same reason backend-smoke carries it.
      BACKBLAZE_REGION: ${{ secrets.CI_BACKBLAZE_REGION || 'eu-central-003' }}
      SOCKET_CROSS_PROCESS_EMIT: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Migrate
        run: npm run migrate
        env:
          MIGRATE_STRICT: "1"

      - name: A worker with no socket transport refuses to start
        # The one new boot fatal. If this ever starts succeeding, a worker could run with every
        # real-time emit silently dropped and a frozen merchant inbox — assert the refusal, not
        # just the happy path.
        run: |
          set +e
          PROCESS_ROLE=worker SOCKET_CROSS_PROCESS_EMIT=false node dist/worker.js > /tmp/refuse.log 2>&1
          code=$?
          set -e
          cat /tmp/refuse.log
          if [ "$code" -eq 0 ]; then
            echo "::error::worker started without SOCKET_CROSS_PROCESS_EMIT — the boot fatal is gone"
            exit 1
          fi
          grep -q "REFUSING TO START" /tmp/refuse.log

      # Start and wait are SEPARATE steps, mirroring backend-smoke. Combining them hid a real
      # failure once: `curl … && break` falls through to `sleep 5`, which succeeds, so the loop
      # exited 0 after every attempt failed — the step went green while the API was dead and a
      # later step took the blame.
      - name: Start API-only process
        run: PROCESS_ROLE=api node dist/server.js > /tmp/api.log 2>&1 &

      - name: Wait for the API
        run: |
          for i in $(seq 1 24); do
            if curl --fail --silent --show-error http://127.0.0.1:8000/api/health > /dev/null; then
              echo "API is healthy"
              exit 0
            fi
            echo "Waiting for API ($i/24)..."
            sleep 5
          done
          echo "::error::API failed to become healthy"
          cat /tmp/api.log
          exit 1

      - name: API-only process runs NO workers
        # The Step 5 regression guard, observed at RUNTIME rather than through the import graph.
        # `jobs/workers.ts` constructs its five Workers as module-load side effects, so if anything
        # ever statically reaches it from `app.ts` again, this process would register consumers in
        # Redis despite PROCESS_ROLE=api — and the split would silently stop being a split.
        run: |
          if ! grep -q "PROCESS_ROLE=api — workers are NOT started" /tmp/api.log; then
            echo "::error::API-only process did not report skipping workers"
            cat /tmp/api.log
            exit 1
          fi
          node -e "
            const { aiQueue } = require('./dist/jobs/queues');
            aiQueue.getWorkersCount()
              .then((n) => {
                console.log('ai-queue consumers registered in Redis:', n);
                if (n !== 0) {
                  console.error('::error::an API-only process registered ' + n + ' worker(s)');
                  process.exit(1);
                }
                process.exit(0);
              })
              .catch((e) => { console.error(e.message); process.exit(1); });
          "

      - name: Start worker process alongside
        run: PROCESS_ROLE=worker node dist/worker.js > /tmp/worker.log 2>&1 &

      - name: Wait for the worker, and confirm the API is unaffected
        run: |
          for i in $(seq 1 24); do
            if curl --fail --silent --show-error http://127.0.0.1:8001/health > /dev/null; then
              echo "Worker is healthy"
              curl --silent http://127.0.0.1:8001/health | head -c 400; echo
              curl --fail --silent --show-error http://127.0.0.1:8000/api/health > /dev/null
              echo "API still healthy alongside the worker"
              exit 0
            fi
            echo "Waiting for worker ($i/24)..."
            sleep 5
          done
          echo "::error::worker failed to become healthy"
          cat /tmp/worker.log
          exit 1

      - name: The worker fleet is now consuming the queues
        # The other half of the previous assertion: the consumers exist, they are just in the other
        # process. Without this, "0 workers" above could pass simply because nothing works at all.
        run: |
          node -e "
            const { aiQueue } = require('./dist/jobs/queues');
            aiQueue.getWorkersCount()
              .then((n) => {
                console.log('ai-queue consumers registered in Redis:', n);
                if (n < 1) {
                  console.error('::error::worker process registered no consumers');
                  process.exit(1);
                }
                process.exit(0);
              })
              .catch((e) => { console.error(e.message); process.exit(1); });
          "

      - name: Killing the worker leaves the API serving (failure-domain independence)
        run: |
          pkill -f "dist/worker.js"
          sleep 3
          curl --fail --silent --show-error http://127.0.0.1:8000/api/health > /dev/null
          echo "API survived the worker dying"

      - name: Print logs on failure
        if: failure()
        run: |
          echo '--- api ---'; cat /tmp/api.log || true
          echo '--- worker ---'; cat /tmp/worker.log || true

  frontend:
    name: Frontend Lint + Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
