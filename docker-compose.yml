# Local full stack: Postgres, Redis, API, SPA (Nginx).
# Dev:  docker compose up --build
# Prod: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Interpolation (${...}): add a .env next to this file with POSTGRES_USER, POSTGRES_PASSWORD,
# POSTGRES_DB, DATABASE_URL (gitignored). backend/.env is still loaded into the backend container
# for JWT_*, OPENAI_API_KEY, ENCRYPTION_KEY, etc. (copy from backend/.env.example).

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-hillside}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - hillside_pg:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # IMPORTANT: BullMQ stores queue/job state in this same Redis. BullMQ requires
    # `noeviction` — under memory pressure `allkeys-lru` would silently evict live
    # job keys and drop inbound messages / pending AI replies with no error. All of
    # our cache keys carry TTLs, so they expire on their own without needing LRU.
    command:
      [
        "redis-server",
        "--save",
        "60",
        "1",
        "--appendonly",
        "yes",
        "--maxmemory-policy",
        "noeviction",
      ]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - hillside_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    logging: *default-logging

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    # Give the graceful shutdown (server.ts) time to drain in-flight BullMQ jobs before Docker
    # SIGKILLs the container. Must exceed SHUTDOWN_TIMEOUT_MS (default 25s) — otherwise Docker's
    # default 10s grace kills mid-job, stalling AI replies on every deploy (P1-2 / audit C-88).
    stop_grace_period: 30s
    ports:
      - "8000:8000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: "8000"
      DATABASE_URL: ${DATABASE_URL}
      PGSSLMODE: disable
      DB_SSL: "false"
      REDIS_URL: redis://redis:6379
      # P3-2. Default `all` = the pre-split topology (Express + Socket.IO + all five workers in one
      # process), so a plain `docker compose up` is unchanged. Set to `api` only when the `worker`
      # service below is actually scaled above zero, or the queues get no consumer at all.
      PROCESS_ROLE: ${BACKEND_PROCESS_ROLE:-all}
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:8000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging: *default-logging

  # P3-2 Step 12 — the out-of-process worker fleet.
  #
  # `replicas: 0` by default, so this service exists but starts nothing: `docker compose up` behaves
  # exactly as before, and enabling the split is `--scale worker=1` plus BACKEND_PROCESS_ROLE=api.
  # Read docker-compose.prod.yml before scaling it in production — the 2 GB droplet is ~91% committed
  # and does not fit a second container at parity.
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Overrides the image CMD, which runs migrations then the API. Migrations must be run by exactly
    # ONE process; with two services off one image, both would race the migrator on every deploy.
    # The API keeps that job (see scripts/deploy.sh, which also runs it as a one-shot beforehand).
    command: ["node", "dist/worker.js"]
    restart: unless-stopped
    # MUST exceed WORKER_SHUTDOWN_TIMEOUT_MS (default 35s). Inverting them means Docker SIGKILLs the
    # process mid-drain and in-flight ai.reply jobs are abandoned — the C-88 defect the API side
    # already fixed with its own 30s/25s pairing.
    stop_grace_period: 60s
    # Deliberately NO `ports:` block. A published host port is what makes `--scale` fail with a port
    # collision on the second replica; without one the worker fleet scales freely.
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: ${DATABASE_URL}
      PGSSLMODE: disable
      DB_SSL: "false"
      REDIS_URL: redis://redis:6379
      PROCESS_ROLE: worker
      WORKER_HEALTH_PORT: "8001"
      # A worker has no local Socket.IO server. Without this it REFUSES TO START — see worker.ts.
      # It must also be true on the API, or the API-side adapter has nothing to receive.
      SOCKET_CROSS_PROCESS_EMIT: ${SOCKET_CROSS_PROCESS_EMIT:-true}
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:8001/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      replicas: 0
    logging: *default-logging

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api}
        VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:8000}
        VITE_META_APP_ID: ${VITE_META_APP_ID:-}
        VITE_WHATSAPP_CONFIGURATION_ID: ${VITE_WHATSAPP_CONFIGURATION_ID:-}
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging: *default-logging

volumes:
  hillside_pg:
  hillside_redis:
