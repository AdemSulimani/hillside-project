server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Strip server header noise.
    server_tokens off;

    # Make sure JS / WASM module scripts are served with strict MIME so the browser
    # never fails the "Expected a JavaScript-or-Wasm module script" check.
    types {
        application/javascript js mjs;
        application/wasm        wasm;
    }

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml+rss
        image/svg+xml
        font/woff2;

    # Hashed assets — safe to cache forever (filename changes when content changes).
    # Returning 404 (no fallback to index.html) is critical: a stale tab requesting an
    # old chunk must get a real 404 so the lazyWithRetry helper triggers a full reload
    # instead of receiving HTML and erroring out with "Expected a JavaScript module".
    location ^~ /assets/ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Service worker (if/when added) and root files must never be long-cached.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # SPA fallback for client-side routes.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
